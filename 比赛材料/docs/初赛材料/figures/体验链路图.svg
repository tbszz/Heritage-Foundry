</defs><rect x="0" y="0" width="1080" height="380" rx="0" fill="#f7f2e7"/><text x="540.0" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#10131a" letter-spacing="1.5">完整体验链路：见 → 懂 → 创 → 作 → 传</text><text x="540.0" y="70" text-anchor="middle" font-size="13" font-weight="400" fill="#6b6558" letter-spacing="0">市面上的非遗类应用绝大多数只做到了第一格，我们做完了五格，并且让它闭环</text><rect x="44.0" y="100" width="178" height="156" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8" filter="url(#sh2)"/><path d="M 56.0 100 L 210.0 100" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/><circle cx="133.0" cy="140" r="21" fill="#c0392b"/><text x="133.0" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0">见</text><text x="133.0" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#10131a" letter-spacing="0">3D 博物馆 · AR 落地</text><text x="133.0" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">文物以真实尺寸</text><text x="133.0" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">落在你家茶几上</text><rect x="93.0" y="229" width="80" height="20" rx="10" fill="#c0392b1f" stroke="#c0392b" stroke-width="0.9"/><text x="133.0" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#c0392b" letter-spacing="0">真实尺度</text><path d="M 227.0 178.0 L 241.5 178.0" stroke="#b8860b" stroke-width="2.4" fill="none" marker-end="url(#arrow2)"/><rect x="247.5" y="100" width="178" height="156" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="1.8" filter="url(#sh2)"/><path d="M 259.5 100 L 413.5 100" stroke="#b8860b" stroke-width="5" stroke-linecap="round"/><circle cx="336.5" cy="140" r="21" fill="#b8860b"/><text x="336.5" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0">懂</text><text x="336.5" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#10131a" letter-spacing="0">故事卡点读</text><text x="336.5" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">从哪来 · 谁还在做</text><text x="336.5" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">为什么快失传</text><rect x="296.5" y="229" width="80" height="20" rx="10" fill="#b8860b1f" stroke="#b8860b" stroke-width="0.9"/><text x="336.5" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#b8860b" letter-spacing="0">情感共鸣</text><path d="M 430.5 178.0 L 445.0 178.0" stroke="#b8860b" stroke-width="2.4" fill="none" marker-end="url(#arrow2)"/><rect x="451.0" y="100" width="178" height="156" rx="12" fill="#ffffff" stroke="#1f7a6d" stroke-width="1.8" filter="url(#sh2)"/><path d="M 463.0 100 L 617.0 100" stroke="#1f7a6d" stroke-width="5" stroke-linecap="round"/><circle cx="540.0" cy="140" r="21" fill="#1f7a6d"/><text x="540.0" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0">创</text><text x="540.0" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#10131a" letter-spacing="0">AI 共创设计</text><text x="540.0" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">18 技艺 × 10 IP × 5 载体</text><text x="540.0" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">× 8 风格 = 7200 种组合</text><rect x="500.0" y="229" width="80" height="20" rx="10" fill="#1f7a6d1f" stroke="#1f7a6d" stroke-width="0.9"/><text x="540.0" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#1f7a6d" letter-spacing="0">文化约束</text><path d="M 634.0 178.0 L 648.5 178.0" stroke="#b8860b" stroke-width="2.4" fill="none" marker-end="url(#arrow2)"/><rect x="654.5" y="100" width="178" height="156" rx="12" fill="#ffffff" stroke="#2f5f9f" stroke-width="1.8" filter="url(#sh2)"/><path d="M 666.5 100 L 820.5 100" stroke="#2f5f9f" stroke-width="5" stroke-linecap="round"/><circle cx="743.5" cy="140" r="21" fill="#2f5f9f"/><text x="743.5" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0">作</text><text x="743.5" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#10131a" letter-spacing="0">实体图纸 + 物料</text><text x="743.5" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">Oklab 匹配 75 个</text><text x="743.5" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">市售拼豆色号</text><rect x="703.5" y="229" width="80" height="20" rx="10" fill="#2f5f9f1f" stroke="#2f5f9f" stroke-width="0.9"/><text x="743.5" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#2f5f9f" letter-spacing="0">可制造性</text><path d="M 837.5 178.0 L 852.0 178.0" stroke="#b8860b" stroke-width="2.4" fill="none" marker-end="url(#arrow2)"/><rect x="858.0" y="100" width="178" height="156" rx="12" fill="#ffffff" stroke="#8854b3" stroke-width="1.8" filter="url(#sh2)"/><path d="M 870.0 100 L 1024.0 100" stroke="#8854b3" stroke-width="5" stroke-linecap="round"/><circle cx="947.0" cy="140" r="21" fill="#8854b3"/><text x="947.0" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0">传</text><text x="947.0" y="184" text-anchor="middle" font-size="13.5" font-weight="600" fill="#10131a" letter-spacing="0">跨设备多屏共赏</text><text x="947.0" y="204" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">手机 → 平板 → 智慧屏</text><text x="947.0" y="220" text-anchor="middle" font-size="11" font-weight="400" fill="#6b6558" letter-spacing="0">分布式软总线</text><rect x="907.0" y="229" width="80" height="20" rx="10" fill="#8854b31f" stroke="#8854b3" stroke-width="0.9"/><text x="947.0" y="243" text-anchor="middle" font-size="11" font-weight="600" fill="#8854b3" letter-spacing="0">鸿蒙原生</text><path d="M 947.0 262 L 947.0 300 L 133.0 300 L 133.0 264" stroke="#1f7a6d" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrowBack)" opacity="0.8"/><rect x="340.0" y="285" width="400" height="30" rx="0" fill="#f7f2e7"/><text x="540.0" y="305" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a6d" letter-spacing="0">作品沉淀进公共画廊，成为下一个人的灵感 —— 内容飞轮</text><text x="540.0" y="360" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6b6558" letter-spacing="0">「遗见 · Heritage Foundry」 ｜ 每一幕都对应「用户体验创新」方向的一条官方解析</text></svg>