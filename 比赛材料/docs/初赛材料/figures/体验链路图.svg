    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
  </marker>
  <marker id="arrowBack" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
