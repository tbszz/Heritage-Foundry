<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0b0d">
  <meta
    name="description"
    content="遗见是一座可探索、可共创的数字非遗博物馆。走进主题展厅，发现传统技艺，并用 AI 继续创造。"
  >
  <title>遗见 | 数字非遗博物馆</title>
  <link rel="preload" href="/fonts/SourceHanSerifSC-Heavy.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/LXGWWenKai-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/generated/museum-cinematic.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="icon" href="/assets/generated/seal-mark-nav.webp" type="image/webp">
  <link rel="stylesheet" href="museum-experience.css">
</head>
<body class="museum-experience-shell">
  <a class="skip-link" href="#museum-content">跳到主要内容</a>

  <header class="museum-nav" aria-label="主导航">
    <a class="museum-brand" href="index.html" aria-label="遗见首页">
      <img src="/assets/generated/seal-mark-nav.webp" alt="" width="40" height="40">
      <span>
        <strong>遗见</strong>
        <small>Heritage Foundry</small>
      </span>
    </a>

    <nav class="museum-nav-links" aria-label="站点导航">
      <a href="#museum-stage">主题展厅</a>
      <a href="crafts.html">技艺图鉴</a>
      <a href="generator.html">AI 共创</a>
      <a href="ar.html">AR 体验</a>
    </nav>

    <button id="experience-mode-toggle" class="mode-toggle" type="button" aria-pressed="false">
      切换省流模式
    </button>
  </header>

  <main id="museum-content">
    <section id="museum-stage" class="museum-stage" aria-labelledby="museum-stage-title">
      <div class="museum-stage-image" role="img" aria-label="巨幅丝绢垂落在当代非遗博物馆大厅"></div>
      <div class="museum-stage-shade" aria-hidden="true"></div>
      <div class="museum-stage-veil museum-stage-veil-left" aria-hidden="true"></div>
      <div class="museum-stage-veil museum-stage-veil-right" aria-hidden="true"></div>

      <div id="sketch-corridor" class="sketch-corridor" aria-hidden="true"></div>
      <div id="sketch-corridor-loader" class="sketch-corridor-loader" role="status" aria-live="polite">
        <span class="sketch-corridor-loader-mark" aria-hidden="true"></span>
        <p>正在绘制手绘长廊…</p>
      </div>

      <div class="museum-stage-copy">
        <p class="museum-stage-kicker">一座仍在生长的数字博物馆</p>
        <h1 id="museum-stage-title">
          传统不是被保存，
          <span>而是被再次看见。</span>
        </h1>
        <p class="museum-stage-intro">
          走进四座主题展厅，触摸十八种非遗技艺，并用 AI 续写它们的当代表达。
        </p>
        <div class="museum-stage-actions">
          <a class="primary-action" href="generator.html">开始 AI 共创</a>
          <a class="secondary-action" href="crafts.html">浏览技艺图鉴</a>
        </div>
      </div>

      <div class="museum-stage-index" aria-label="馆藏概览">
        <span><strong>18</strong> 项数字馆藏</span>
        <span><strong>4</strong> 座主题展厅</span>
        <span><strong>1</strong> 个共创工坊</span>
      </div>

      <p class="sketch-corridor-hud" id="sketch-corridor-hud" aria-hidden="true">滚轮逛长廊 · 点击木门进入展厅</p>
      <button id="corridor-back" class="corridor-back" type="button" hidden>← 返回长廊</button>
    </section>
  </main>

  <dialog id="artifact-dialog" class="artifact-dialog" aria-labelledby="artifact-name">
    <button class="artifact-dialog-close" type="button" data-close-dialog aria-label="关闭藏品详情">×</button>
    <div class="artifact-dialog-media">
      <div id="artifact-3d-stage" class="artifact-3d-stage" aria-label="可拖动旋转的三维馆藏模型"></div>
      <div id="artifact-3d-loader" class="artifact-3d-loader" role="status" aria-live="polite" hidden>
        <span class="sketch-corridor-loader-mark" aria-hidden="true"></span>
        <p>正在唤醒三维馆藏…</p>
      </div>
      <p class="artifact-3d-hint" aria-hidden="true">拖动旋转 · 滚轮缩放</p>
    </div>
    <div class="artifact-dialog-copy">
      <p id="artifact-category">传统陶瓷</p>
      <h2 id="artifact-name">景德镇陶瓷</h2>
      <strong id="artifact-description"></strong>
      <span id="artifact-story"></span>
      <div class="artifact-dialog-actions">
        <a id="artifact-craft-link" class="primary-action" href="crafts.html">查看完整技艺</a>
        <a id="artifact-create-link" class="secondary-action" href="generator.html">用它开始创作</a>
      </div>
    </div>
  </dialog>

  <script type="module" src="home.js"></script>
</body>
</html>
